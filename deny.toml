# cargo deny --locked check licenses sources (advisories are cargo-audit's, in build.yml)
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
    "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/EpicGames/lore.git",
    "https://github.com/Lokee86/Reliquary.git",
    "https://github.com/Lokee86/hermes-rust-rewrite.git", # Pinned glib 0.18 security backport
    "https://github.com/Lokee86/lodestone.git",
    "https://github.com/herdrdev/herdr-core",
]
