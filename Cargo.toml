[workspace]
members = ["crates/engine", "crates/desktop", "crates/library", "crates/gateway", "crates/telegram", "crates/python-host", "crates/plugins/reliquary"]
default-members = ["crates/desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
async-channel = "2"
tokio-util = "0.7"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

# Lore uses the Quinn extensions shipped by this exact Reliquary revision. quinn-proto is only in the
# build graph when the `reliquary` feature is enabled.
[patch.crates-io]
quinn-proto = { git = "https://github.com/Lokee86/Reliquary.git", rev = "48d5cbcf8e616dd67ef59772bae5f5d5b78445b3" }
