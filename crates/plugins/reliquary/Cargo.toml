[package]
name = "hermes-reliquary-plugin"
version.workspace = true
edition.workspace = true
publish = false

[features]
native = ["dep:reliquary-memory"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
hermes-engine = { path = "../../engine" }
hermes-library = { path = "../../library" }
reliquary-memory = { git = "https://github.com/Lokee86/Reliquary.git", rev = "f212204d4d099f5b4d87db2dbf636cea55111b82", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
