[package]
name = "hermes-reliquary-plugin"
version.workspace = true
edition.workspace = true
publish = false

[features]
native = ["dep:reliquary-memory"]

[dependencies]
anyhow.workspace = true
blake3 = "1"
tokio.workspace = true
hermes-engine = { path = "../../engine" }
hermes-library = { path = "../../library" }
reliquary-memory = { git = "https://github.com/Lokee86/Reliquary.git", rev = "5e4d5b0ba1ff0b498bd025bbc87394e702f48b18", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-channel.workspace = true
