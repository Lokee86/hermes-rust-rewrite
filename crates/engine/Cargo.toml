[package]
name = "hermes-engine"
version.workspace = true
edition.workspace = true
publish = false

[features]
embedded-herdr = ["dep:herdr-core"]

[dependencies]
herdr-core = { git = "https://github.com/herdrdev/herdr-core", rev = "6e2984629fcd600b0165f69b2e5b0bda5985ec1c", optional = true }
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
process-wrap = { version = "9.0.3", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
async-channel.workspace = true
ring = "0.17"
base64 = "0.22"
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
cap-std = "4"
eventsource-stream = "0.2"
fs2 = "0.4"
regex = "1"
shlex = "2"
flate2 = "1"
fancy-regex = "0.16"
unicode-normalization = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
axum = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
