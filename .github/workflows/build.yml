name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      stock_composer:
        description: Compare shell.exec with the pinned stock gateway on each native runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Likely mistakes (not style) and known vulnerabilities in the locked dependencies.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - run: rustup update stable && rustup component add clippy
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libdbus-1-dev libasound2-dev libfontconfig1-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - run: scripts/python-runtime.sh >> "$GITHUB_ENV"
      - run: cargo clippy --locked --workspace --all-targets -- -A clippy::all -D clippy::correctness -D clippy::suspicious
      - run: cargo install cargo-audit --locked --version 0.22.0
      - run: cargo audit
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: rustup update stable
      # Iced (winit, wgpu), the OS webview (wry → WebKitGTK), global-hotkey (X11) and audio.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libdbus-1-dev libasound2-dev libfontconfig1-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      # The pinned standalone CPython hermes-python-host embeds (and the packages ship), for every
      # build and test in this job.
      - if: runner.os != 'Windows'
        run: scripts/python-runtime.sh >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: |
          $python = ./scripts/python-runtime.ps1
          "PYO3_PYTHON=$python" >> $env:GITHUB_ENV
          Split-Path $python >> $env:GITHUB_PATH
      - run: cargo test --locked --workspace
        shell: bash
      - if: inputs.stock_composer
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: NousResearch/hermes-agent
          ref: caafe5389ae585ef77387a962aee05b1bcf17029
          path: .stock-hermes
          persist-credentials: false
      - if: inputs.stock_composer
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - if: inputs.stock_composer
        name: Prepare stock and Rust composer drivers
        id: composer_tools
        shell: bash
        run: |
          python -m pip install ./.stock-hermes aiohttp==3.14.5
          cargo build --locked -p hermes-gateway --bin hermes-gateway -p hermes-engine --example composer_classifier
      - if: inputs.stock_composer
        name: Compare native composer commands with stock Hermes
        shell: bash
        run: |
          binary=target/debug/hermes-gateway
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          set -o pipefail
          python scripts/verify_stock_composer_shell.py --source-checkout .stock-hermes --gateway-exe "$binary" | tee "composer-shell-$RUNNER_OS.json"
      - if: ${{ !cancelled() && inputs.stock_composer && steps.composer_tools.outcome == 'success' }}
        name: Compare native and stock command decisions
        shell: bash
        run: |
          classifier=target/debug/examples/composer_classifier
          if [[ "$RUNNER_OS" == Windows ]]; then classifier+=.exe; fi
          set -o pipefail
          python scripts/compare_composer_classifiers.py --source-checkout .stock-hermes --rust-classifier "$classifier" --json | tee "composer-classifier-$RUNNER_OS.json"
      - if: always() && inputs.stock_composer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composer-shell-${{ runner.os }}
          path: |
            composer-shell-*.json
            composer-classifier-*.json
          if-no-files-found: ignore
      # Signing is optional: without these secrets (forks, pull requests) packages are unsigned.
      - name: Import signing certificates
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          WINDOWS_PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == macOS && -n "$APPLE_CERTIFICATE" ]]; then
            password=$(openssl rand -hex 16)
            keychain="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            base64 -d <<< "$APPLE_CERTIFICATE" > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db
            echo "CODESIGN_IDENTITY=$APPLE_IDENTITY" >> "$GITHUB_ENV"
            if [[ -n "$APPLE_NOTARY_KEY" ]]; then
              base64 -d <<< "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
              { echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"; echo "NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"; echo "NOTARY_ISSUER=$APPLE_NOTARY_ISSUER"; } >> "$GITHUB_ENV"
            fi
          fi
          if [[ "$RUNNER_OS" == Windows && -n "$WINDOWS_PFX" ]]; then
            base64 -d <<< "$WINDOWS_PFX" > "$RUNNER_TEMP/signing.pfx"
            { echo "WINDOWS_CERTIFICATE=$(cygpath -w "$RUNNER_TEMP/signing.pfx")"; echo "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_PFX_PASSWORD"; } >> "$GITHUB_ENV"
          fi
      - if: runner.os == 'Linux'
        run: scripts/package-linux.sh
      - if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1
      - if: runner.os == 'macOS'
        run: scripts/package-macos.sh && ditto -c -k --sequesterRsrc --keepParent dist/Hermes.app dist/Hermes-macOS.zip
      - name: Verify release license and source notices
        shell: bash
        run: |
          shopt -s nullglob
          python scripts/reliquary-notices.py verify dist/*.zip dist/*.tar.gz
      # Start the packaged app on a real desktop of each kind and require its window.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers && xvfb-run -a -s "-screen 0 1280x800x24" scripts/smoke-linux.sh dist/Hermes-linux-x86_64.tar.gz dist/smoke-linux.png
      - if: runner.os == 'Windows'
        run: ./scripts/smoke-windows.ps1 dist/Hermes-windows-AMD64.zip dist/smoke-windows.png
      - if: runner.os == 'macOS'
        run: scripts/smoke-macos.sh dist/Hermes.app dist/smoke-macos.png
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ runner.os }}
          path: dist/smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hermes-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*-setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: Hermes-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Hermes (Rust) $GITHUB_REF_NAME" --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
